name: Extract Video Frames

on:
  push:
    paths:
      - 'public/videos/tour-raw.mp4'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Extract 50 frames
        run: |
          mkdir -p public/frames
          rm -f public/frames/*.jpg
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/videos/tour-raw.mp4)
          echo "Duration: $DURATION seconds"
          FPS=$(awk "BEGIN {print 50 / $DURATION}")
          echo "Extracting at fps=$FPS"
          ffmpeg -i public/videos/tour-raw.mp4 -vf "fps=$FPS" -q:v 2 public/frames/frame-%03d.jpg
          echo "Extracted $(ls public/frames | wc -l) frames"

      - name: Commit frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/frames
          git diff --staged --quiet || git commit -m "Auto-extract tour frames"
          git push
